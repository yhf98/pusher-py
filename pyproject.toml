[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pusher-py"
version = "0.1.0"
description = "A standard C/C++ native extension template for Python stream pusher plugins."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "yhf98" }
]
keywords = ["python-extension", "c-api", "cpp", "stream", "pusher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/yhf98/pusher-py"
Repository = "https://github.com/yhf98/pusher-py"
Issues = "https://github.com/yhf98/pusher-py/issues"
Documentation = "https://github.com/yhf98/pusher-py/blob/main/SDK_API.md"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0"
]

[project.scripts]
pusher = "pusher.cli:main"
pusher-py = "pusher.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pusher"]
include-package-data = true

[tool.setuptools.package-data]
pusher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
